{{- if and (not .Values.tls.existingSecret) (or .Values.tls.enabled .Values.postgresql.tls.enabled .Values.redis.tls.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: fortiaigate-tls-secret
  labels:
    app.kubernetes.io/name: fortiaigate
    app.kubernetes.io/part-of: fortiaigate-platform
    app.kubernetes.io/managed-by: helm
type: kubernetes.io/tls
data:
  tls.crt: {{ required "Set tls.existingSecret or supply tls.cert with a chart certificate file" (.Files.Get .Values.tls.cert) | b64enc }}
  tls.key: {{ required "Set tls.existingSecret or supply tls.key with a chart private key file" (.Files.Get .Values.tls.key) | b64enc }}
{{- end }}
