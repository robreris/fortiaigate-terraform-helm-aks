{{- if not (or .Values.fortiaigate.env.csrfSecretKey .Values.fortiaigate.env.csrfExistingSecret) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "fortiaigate.csrfSecretName" .) | default dict }}
{{- $data := get $existing "data" | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fortiaigate.csrfSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fortiaigate.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  csrf-secret-key: {{ get $data "csrf-secret-key" | default (randAlphaNum 32 | b64enc) | quote }}
{{- end }}
