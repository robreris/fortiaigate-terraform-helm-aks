{{- if not (or .Values.api.masterKeyExistingSecret .Values.dpAgent.masterKeyExistingSecret) }}
# Auto-generated master key sealing credential secrets at rest (go-common/secret),
# used only when the operator hasn't brought their own via api.masterKeyExistingSecret
# or dpAgent.masterKeyExistingSecret (see fortiaigate.masterKeySecretName in _helpers.tpl).
#
# Without this, a fresh install had no key at all: api-go refused every credential
# write with a 503 rather than store it in plaintext, and there was no way to get a
# working install without a manual `kubectl create secret` step first.
#
# Two things make this safe to auto-generate, unlike a password Helm can freely
# reroll:
#   - `lookup` reads back an already-created key so `helm upgrade` never rotates it.
#     Losing or changing this key permanently orphans every credential already
#     encrypted with it — not a login session to just re-issue.
#   - `helm.sh/resource-policy: keep` survives `helm uninstall`, so resetting the
#     release (e.g. to force a fresh Postgres) doesn't also destroy the only key
#     that can decrypt data on storage that outlives the release (Retain PVs).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fortiaigate.fullname" . }}-master-key
  namespace: {{ include "fortiaigate.namespace" . }}
  labels:
    {{- include "fortiaigate.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
data:
  {{- $existing := (lookup "v1" "Secret" (include "fortiaigate.namespace" .) (printf "%s-master-key" (include "fortiaigate.fullname" .))) | default dict }}
  {{- $existingData := (get $existing "data") | default dict }}
  master-key: {{ (get $existingData "master-key") | default (randAlphaNum 32 | b64enc) }}
{{- end }}
